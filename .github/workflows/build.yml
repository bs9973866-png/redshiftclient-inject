name: Fabric Client Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Build Fabric mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload Minecraft mod
        uses: actions/upload-artifact@v4
        with:
          name: redshift-client-fabric-1.21.11
          path: build/libs/redshift-client-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
